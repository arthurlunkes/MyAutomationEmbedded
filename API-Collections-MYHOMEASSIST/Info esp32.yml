info:
  name: Info esp32
  type: http
  seq: 6

http:
  method: GET
  url: "{{URL-BASE}}/info"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example success
    request:
      url: "{{URL-BASE}}/info"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: content-length
          value: "90"
        - name: connection
          value: close
      body:
        type: json
        data: |-
          {
            "mac": "A4:F0:0F:67:4D:A8",
            "ip": "192.168.1.33",
            "hostname": "alarme.local",
            "connected": true
          }
