info:
  name: Reset WiFi esp32
  type: http
  seq: 7

http:
  method: GET
  url: "{{URL-BASE}}/reset"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example success
    request:
      url: "{{URL-BASE}}/reset"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: content-length
          value: "16"
        - name: connection
          value: close
      body:
        type: json
        data: |-
          {
            "success": true
          }
