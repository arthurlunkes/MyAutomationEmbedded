info:
  name: Root esp32
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL-BASE}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example success
    request:
      url: "{{URL-BASE}}/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: text/html
        - name: content-length
          value: "492"
        - name: connection
          value: close
      body:
        type: html
        data: <html><body><h1>Controle do ESP32</h1><p><a href='/H'><button style='height:50px;width:100px;background:green;color:white;border:none;border-radius:5px;'>LIGAR</button></a></p><p><a href='/L'><button style='height:50px;width:100px;background:red;color:white;border:none;border-radius:5px;'>DESLIGAR</button></a></p><p><a href='/reset'><button style='height:50px;width:150px;background:gray;color:white;border:none;border-radius:5px;margin-top:20px'>RESETAR WIFI</button></a></p></body></html>
