info:
  name: Status esp32
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL-BASE}}/status"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: example success
    request:
      url: http://192.168.1.33/status
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: content-length
          value: "45"
        - name: connection
          value: close
      body:
        type: json
        data: |-
          {
            "mac": "A4:F0:0F:67:4D:A8",
            "configured": true
          }
